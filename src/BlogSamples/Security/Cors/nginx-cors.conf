# ----------------------------------------------------------------------
# Artigo: CORS não é detalhe: por que times ainda erram esse básico
# URL: https://zocate.li/posts/2026/cors-seguranca-nginx-aspnet-core/
# Exemplo de configuração NGINX com allowlist, preflight e Vary: Origin
# ----------------------------------------------------------------------

map $http_origin $cors_origin {
    default "";
    "https://app.zocate.li" $http_origin;
    "https://admin.zocate.li" $http_origin;
}

server {
    listen 443 ssl http2;
    server_name api.zocate.li;

    location /api/security/cors/ {
        if ($cors_origin != "") {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Vary Origin always;
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Demo-Token" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://backend_cors;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}